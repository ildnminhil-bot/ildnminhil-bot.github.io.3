<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyber Liquid Lab</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #03030c;
      color: #00f0ff;
      font-family: 'Segoe UI', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    h1 {
      font-size: 22px;
      letter-spacing: 3px;
      text-shadow: 0 0 12px #00f0ff;
      margin-bottom: 5px;
    }

    .status-text {
      font-size: 13px;
      color: #8a99ad;
      margin-bottom: 15px;
    }

    #labContainer {
      position: relative;
      width: 380px;
      height: 420px;
    }

    canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
    }

    /* Bảng điều khiển nút bấm */
    .controls {
      display: flex;
      gap: 12px;
      margin-top: 15px;
      z-index: 10;
    }

    .btn-element {
      padding: 10px 16px;
      border: 1px solid;
      background: rgba(10, 15, 30, 0.8);
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
      font-size: 12px;
      letter-spacing: 1px;
      transition: all 0.2s;
    }

    .btn-blue { color: #00f0ff; border-color: #00f0ff; box-shadow: 0 0 10px rgba(0,240,255,0.3); }
    .btn-pink { color: #ff007f; border-color: #ff007f; box-shadow: 0 0 10px rgba(255,0,127,0.3); }
    .btn-green { color: #00ff66; border-color: #00ff66; box-shadow: 0 0 10px rgba(0,255,102,0.3); }

    .btn-element:hover { transform: translateY(-3px) scale(1.05); }
    .btn-blue:hover { background: #00f0ff; color: #000; }
    .btn-pink:hover { background: #ff007f; color: #000; }
    .btn-green:hover { background: #00ff66; color: #000; }

    .btn-reset {
      margin-top: 12px;
      padding: 6px 18px;
      background: transparent;
      border: 1px dashed #666;
      color: #aaa;
      border-radius: 12px;
      cursor: pointer;
      font-size: 11px;
    }
    .btn-reset:hover { color: #fff; border-color: #fff; }
  </style>
</head>
<body>

  <h1>🧪 CYBER LIQUID LAB</h1>
  <p class="status-text" id="potionLabel">Dung dịch: [ Trống ]</p>

  <div id="labContainer">
    <canvas id="labCanvas"></canvas>
  </div>

  <div class="controls">
    <button class="btn-element btn-blue" onclick="pourLiquid(0, 240, 255)">+ NEON BLUE</button>
    <button class="btn-element btn-pink" onclick="pourLiquid(255, 0, 127)">+ MAGENTA</button>
    <button class="btn-element btn-green" onclick="pourLiquid(0, 255, 102)">+ BIO GREEN</button>
  </div>

  <button class="btn-reset" onclick="resetFlask()">Làm Sạch Bình</button>

  <script>
    const canvas = document.getElementById('labCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = 380;
    canvas.height = 420;

    // Tọa độ & Kích thước Bình Thủy Tinh (Beaker)
    const flask = {
      x: 90,
      y: 120,
      width: 200,
      height: 250,
      bottomY: 370
    };

    let particles = [];
    let bubbles = [];
    let totalColor = { r: 0, g: 0, b: 0, count: 0 };

    // Lớp Hạt Chất Lỏng
    class LiquidParticle {
      constructor(colorR, colorG, colorB) {
        this.x = flask.x + flask.width / 2 + (Math.random() * 20 - 10);
        this.y = flask.y - 30;
        this.vx = (Math.random() - 0.5) * 2;
        this.vy = Math.random() * 3 + 4;
        this.radius = Math.random() * 4 + 4;
        this.r = colorR;
        this.g = colorG;
        this.b = colorB;
        this.settled = false;
      }

      update() {
        if (!this.settled) {
          this.vy += 0.3; // Trọng lực
          this.x += this.vx;
          this.y += this.vy;

          // Va chạm với thành bình bên trái/phải
          if (this.x - this.radius < flask.x) {
            this.x = flask.x + this.radius;
            this.vx *= -0.5;
          }
          if (this.x + this.radius > flask.x + flask.width) {
            this.x = flask.x + flask.width - this.radius;
            this.vx *= -0.5;
          }

          // Giới hạn đáy bình dâng lên theo số lượng hạt
          let currentLiquidLevel = flask.bottomY - (particles.filter(p => p.settled).length * 0.15);
          if (this.y + this.radius >= currentLiquidLevel) {
            this.y = currentLiquidLevel - this.radius;
            this.settled = true;
            this.vx = 0;
            this.vy = 0;
          }
        }
      }

      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgb(${this.r}, ${this.g}, ${this.b})`;
        ctx.shadowColor = `rgb(${this.r}, ${this.g}, ${this.b})`;
        ctx.shadowBlur = 8;
        ctx.fill();
        ctx.shadowBlur = 0;
      }
    }

    // Lớp Bọt Khí Sóng Sánh
    class Bubble {
      constructor(liquidHeight, colorStr) {
        this.x = flask.x + 10 + Math.random() * (flask.width - 20);
        this.y = flask.bottomY - Math.random() * liquidHeight;
        this.radius = Math.random() * 3 + 1;
        this.vy = Math.random() * 1 + 0.5;
        this.color = colorStr;
      }
      update(liquidHeight) {
        this.y -= this.vy;
        if (this.y < flask.bottomY - liquidHeight) {
          this.y = flask.bottomY;
          this.x = flask.x + 10 + Math.random() * (flask.width - 20);
        }
      }
      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(255, 255, 255, 0.6)";
        ctx.fill();
      }
    }

    // Rót chất lỏng khi bấm nút
    function pourLiquid(r, g, b) {
      for (let i = 0; i < 25; i++) {
        setTimeout(() => {
          particles.push(new LiquidParticle(r, g, b));
          totalColor.r += r;
          totalColor.g += g;
          totalColor.b += b;
          totalColor.count++;
          updatePotionLabel();
        }, i * 30);
      }
    }

    // Cập nhật tên thuốc dựa trên tỷ lệ màu
    function updatePotionLabel() {
      if (totalColor.count === 0) return;
      let avgR = Math.round(totalColor.r / totalColor.count);
      let avgG = Math.round(totalColor.g / totalColor.count);
      let avgB = Math.round(totalColor.b / totalColor.count);

      let label = "Dung dịch: ";
      if (avgR > 150 && avgB > 150) label += "💜 THẦN CHÚ TÍM VŨ TRỤ (COSMIC VOID)";
      else if (avgG > 150 && avgB > 150) label += "🩵 DƯỢC LIỆU BĂNG TÁI TẠO (CYBER ICE)";
      else if (avgR > 150 && avgG > 150) label += "💛 NĂNG LƯỢNG MẶT TRỜI (SOLAR PULSE)";
      else if (avgR > 180) label += "🩷 CHẤT ĐỘC MAGENTA (NEON POISON)";
      else if (avgG > 180) label += "💚 HUYẾT TƯƠNG QUÁI VẬT (BIO TOXIN)";
      else label += "💙 KHÍ CẦU PLASMA (QUANTUM LIQUID)";

      document.getElementById('potionLabel').innerText = label;
    }

    function resetFlask() {
      particles = [];
      bubbles = [];
      totalColor = { r: 0, g: 0, b: 0, count: 0 };
      document.getElementById('potionLabel').innerText = "Dung dịch: [ Trống ]";
    }

    // Vẽ Bình Thủy Tinh Hologram
    function drawFlask() {
      ctx.strokeStyle = "rgba(0, 240, 255, 0.8)";
      ctx.lineWidth = 3;
      ctx.shadowColor = "#00f0ff";
      ctx.shadowBlur = 12;

      ctx.beginPath();
      // Vòi trên
      ctx.moveTo(flask.x + 40, flask.y);
      ctx.lineTo(flask.x + flask.width - 40, flask.y);
      // Thân bình thẳng
      ctx.moveTo(flask.x + 40, flask.y);
      ctx.lineTo(flask.x + 40, flask.y + 40);
      ctx.moveTo(flask.x + flask.width - 40, flask.y);
      ctx.lineTo(flask.x + flask.width - 40, flask.y + 40);
      // Đáy bình phình to
      ctx.lineTo(flask.x + flask.width, flask.bottomY);
      ctx.lineTo(flask.x, flask.bottomY);
      ctx.lineTo(flask.x + 40, flask.y + 40);
      ctx.stroke();

      ctx.shadowBlur = 0;
    }

    // Vòng lặp render chính
    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      drawFlask();

      // Cập nhật hạt
      particles.forEach(p => {
        p.update();
        p.draw();
      });

      // Tạo bọt khí khi có dung dịch
      let settledCount = particles.filter(p => p.settled).length;
      let liquidHeight = settledCount * 0.15;
      
      if (liquidHeight > 10 && bubbles.length < 15) {
        bubbles.push(new Bubble(liquidHeight));
      }

      bubbles.forEach(b => {
        b.update(liquidHeight);
        b.draw();
      });

      requestAnimationFrame(render);
    }

    render();
  </script>
</body>
</html>
