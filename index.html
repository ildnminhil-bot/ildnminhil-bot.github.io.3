<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>CYBER AUDIO SYNTHESIZER</title>
  <style>
    body { margin: 0; background: #020208; color: #00f0ff; font-family: monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
    canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
    .ui { position: relative; z-index: 10; text-align: center; background: rgba(5,15,30,0.85); padding: 30px; border-radius: 15px; border: 1px solid #00f0ff; box-shadow: 0 0 30px rgba(0,240,255,0.3); }
    button { margin: 10px; padding: 12px 20px; background: transparent; border: 1px solid #ff007f; color: #ff007f; font-weight: bold; cursor: pointer; border-radius: 8px; transition: 0.3s; }
    button:hover { background: #ff007f; color: white; box-shadow: 0 0 15px #ff007f; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div class="ui">
    <h2>⚡ CYBER AUDIO CORE</h2>
    <p>Bấm các nút dưới đây để tạo âm thanh Sci-Fi bằng thuật toán!</p>
    <button onclick="playLaser()">Tia Lazer 8-Bit</button>
    <button onclick="playWarp()">Cổng Không Gian</button>
    <button onclick="playPulse()">Xung Năng Lượng</button>
  </div>

  <script>
    // 1. Khởi tạo Web Audio API
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playLaser() {
      let osc = audioCtx.createOscillator();
      let gain = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(800, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.2);
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + 0.2);
      triggerWave();
    }

    function playWarp() {
      let osc = audioCtx.createOscillator();
      let gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(150, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.5);
      gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
      gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + 0.5);
      triggerWave();
    }

    function playPulse() {
      let osc = audioCtx.createOscillator();
      let gain = audioCtx.createGain();
      osc.type = 'square';
      osc.frequency.setValueAtTime(60, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
      gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + 0.4);
      triggerWave();
    }

    // 2. Hiệu ứng Sóng Âm trên Canvas
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    let radius = 0, opacity = 0;

    function triggerWave() { radius = 10; opacity = 1; }

    function draw() {
      ctx.fillStyle = 'rgba(2, 2, 8, 0.2)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      if (opacity > 0) {
        ctx.beginPath();
        ctx.arc(canvas.width/2, canvas.height/2, radius, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(0, 240, 255, ${opacity})`;
        ctx.lineWidth = 4;
        ctx.stroke();
        radius += 12; opacity -= 0.02;
      }
      requestAnimationFrame(draw);
    }
    draw();
  </script>
</body>
</html>
