<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DREAMCORE AI — Link Decrypter</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #030308;
      color: #00f0ff;
      height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Canvas Nền Hạt Tương Tác */
    #bgCanvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 1;
    }

    /* Card Kính Mờ Chính Giữa Màn Hình */
    .glass-card {
      position: relative;
      z-index: 10;
      width: 90%;
      max-width: 450px;
      padding: 30px;
      background: rgba(10, 15, 30, 0.85);
      backdrop-filter: blur(12px);
      border-radius: 16px;
      border: 1px solid rgba(0, 240, 255, 0.4);
      box-shadow: 0 0 30px rgba(0, 240, 255, 0.25), inset 0 0 15px rgba(0, 240, 255, 0.1);
      text-align: center;
    }

    h2 {
      font-size: 22px;
      letter-spacing: 2px;
      text-shadow: 0 0 12px #00f0ff;
      margin-bottom: 20px;
      text-transform: uppercase;
    }

    .input-box {
      width: 100%;
      padding: 12px 15px;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid #00f0ff;
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
      outline: none;
      margin-bottom: 15px;
      box-shadow: inset 0 0 8px rgba(0, 240, 255, 0.2);
    }

    .input-box:focus {
      border-color: #ff007f;
      box-shadow: 0 0 10px rgba(255, 0, 127, 0.5);
    }

    .btn-decrypt {
      width: 100%;
      padding: 12px;
      background: #ff007f;
      border: none;
      color: #fff;
      font-weight: bold;
      letter-spacing: 1.5px;
      border-radius: 8px;
      cursor: pointer;
      text-transform: uppercase;
      transition: all 0.3s;
      box-shadow: 0 0 15px rgba(255, 0, 127, 0.4);
    }

    .btn-decrypt:hover {
      background: #e0006f;
      box-shadow: 0 0 25px #ff007f;
      transform: translateY(-2px);
    }

    #result {
      margin-top: 20px;
      font-size: 13px;
      word-break: break-all;
      color: #00ff66;
      min-height: 20px;
      line-height: 1.5;
    }

    #result a {
      color: #00f0ff;
      text-decoration: underline;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <canvas id="bgCanvas"></canvas>

  <div class="glass-card">
    <h2>🔓 LINK DECRYPTER</h2>
    <input type="text" id="shortUrl" class="input-box" placeholder="Dán link rút gọn hoặc mã Base64 vào đây...">
    <button class="btn-decrypt" onclick="bypassLink()">GIẢI MÃ & BÓC LINK</button>
    <div id="result"></div>
  </div>

  <script>
    // 1. Nền hạt tương tác Canvas
    const canvas = document.getElementById('bgCanvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    const mouse = { x: null, y: null };

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    window.addEventListener('mousemove', (e) => {
      mouse.x = e.x;
      mouse.y = e.y;
    });

    class Particle {
      constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 2 + 1;
        this.speedX = (Math.random() - 0.5) * 1.5;
        this.speedY = (Math.random() - 0.5) * 1.5;
      }
      update() {
        this.x += this.speedX;
        this.y += this.speedY;

        if (this.x < 0 || this.x > canvas.width) this.speedX *= -1;
        if (this.y < 0 || this.y > canvas.height) this.speedY *= -1;

        let dx = mouse.x - this.x;
        let dy = mouse.y - this.y;
        let dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < 100) {
          this.x -= dx * 0.03;
          this.y -= dy * 0.03;
        }
      }
      draw() {
        ctx.fillStyle = '#00f0ff';
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    for (let i = 0; i < 70; i++) particles.push(new Particle());

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => { p.update(); p.draw(); });
      requestAnimationFrame(animate);
    }
    animate();

    // 2. Logic giải mã URL / Base64
    function bypassLink() {
      const input = document.getElementById('shortUrl').value.trim();
      const resultDiv = document.getElementById('result');
      if (!input) return alert('Vui lòng nhập link hoặc chuỗi mã hóa!');

      resultDiv.innerText = 'Đang phân tích cấu trúc URL...';

      setTimeout(() => {
        try {
          let cleanUrl = input;

          if (!input.startsWith('http') && input.length > 15) {
            cleanUrl = atob(input);
          } else if (input.includes('?')) {
            const urlObj = new URL(input);
            const params = new URLSearchParams(urlObj.search);
            const realTarget = params.get('url') || params.get('redirect') || params.get('dest') || params.get('target');
            if (realTarget) cleanUrl = decodeURIComponent(realTarget);
          }

          resultDiv.innerHTML = `Link đích bóc tách được:<br><a href="${cleanUrl}" target="_blank">${cleanUrl}</a>`;
        } catch (e) {
          resultDiv.innerText = 'Không thể tự bóc tách chuỗi này. Hãy kiểm tra lại định dạng!';
        }
      }, 500);
    }
  </script>
</body>
