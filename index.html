<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyberpunk AI Studio</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.8.0/vanilla-tilt.min.js"></script>
  <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Roboto, sans-serif;
      background: #050510;
      color: #00f0ff;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Nền hạt sáng 3D */
    #particles-js {
      position: absolute;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* Card hiệu ứng Kính mờ Cyberpunk */
    .glass-card {
      position: relative;
      z-index: 2;
      width: 420px;
      padding: 30px;
      background: rgba(10, 15, 30, 0.75);
      backdrop-filter: blur(15px);
      border-radius: 20px;
      border: 1px solid rgba(0, 240, 255, 0.3);
      box-shadow: 0 0 30px rgba(0, 240, 255, 0.2), inset 0 0 15px rgba(0, 240, 255, 0.1);
      text-align: center;
      transform-style: preserve-3d;
    }

    h2 {
      font-size: 24px;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: 0 0 10px #00f0ff;
      margin-bottom: 20px;
    }

    .input-group {
      margin-bottom: 20px;
      position: relative;
    }

    input {
      width: 100%;
      padding: 12px 15px;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid #00f0ff;
      border-radius: 8px;
      color: #fff;
      outline: none;
      font-size: 14px;
      box-shadow: inset 0 0 8px rgba(0, 240, 255, 0.3);
    }

    /* Nút bấm Neon quét sáng */
    button {
      width: 100%;
      padding: 12px;
      background: transparent;
      border: 2px solid #ff007f;
      color: #ff007f;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      position: relative;
      overflow: hidden;
      transition: all 0.3s ease;
      box-shadow: 0 0 15px rgba(255, 0, 127, 0.4);
    }

    button:hover {
      background: #ff007f;
      color: #fff;
      box-shadow: 0 0 25px #ff007f;
    }

    /* Khung hiển thị ảnh với hiệu ứng Hologram Scan */
    .img-box {
      margin-top: 20px;
      width: 100%;
      height: 250px;
      border: 1px dashed #00f0ff;
      border-radius: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;
      background: rgba(0, 0, 0, 0.3);
    }

    .img-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
      border-radius: 12px;
    }

    /* Tia laser quét khi đang tạo ảnh */
    .scanner {
      display: none;
      position: absolute;
      top: 0; left: 0; width: 100%; height: 5px;
      background: #00f0ff;
      box-shadow: 0 0 15px #00f0ff, 0 0 30px #00f0ff;
      animation: scan 1.5s infinite linear;
    }

    @keyframes scan {
      0% { top: 0; }
      50% { top: 100%; }
      100% { top: 0; }
    }
  </style>
</head>
<body>

  <div id="particles-js"></div>

  <div class="glass-card" data-tilt data-tilt-max="15" data-tilt-speed="400">
    <h2>⚡ AI Core Visualizer</h2>
    
    <div class="input-group">
      <input type="text" id="prompt" placeholder="Nhập ý tưởng (vd: Cyberpunk city at night)...">
    </div>

    <button onclick="createAI()">Khởi tạo dữ liệu</button>

    <div class="img-box" id="imgContainer">
      <div class="scanner" id="scanner"></div>
      <span id="placeholderText" style="font-size: 13px; color: #888;">[ Sẵn sàng nhận lệnh ]</span>
      <img id="aiImage" src="" alt="AI Output">
    </div>
  </div>

  <script>
    // 1. Khởi tạo hiệu ứng nền hạt
    particlesJS("particles-js", {
      "particles": {
        "number": { "value": 80 },
        "color": { "value": "#00f0ff" },
        "shape": { "type": "circle" },
        "opacity": { "value": 0.5 },
        "size": { "value": 3 },
        "line_linked": { "enable": true, "distance": 150, "color": "#00f0ff", "opacity": 0.2, "width": 1 },
        "move": { "enable": true, "speed": 2 }
      }
    });

    // 2. Xử lý logic tạo ảnh & animation laser
    function createAI() {
      const prompt = document.getElementById('prompt').value.trim();
      const scanner = document.getElementById('scanner');
      const img = document.getElementById('aiImage');
      const placeholder = document.getElementById('placeholderText');

      if (!prompt) return alert("Vui lòng nhập mô tả!");

      // Bật tia laser quét
      scanner.style.display = 'block';
      img.style.display = 'none';
      placeholder.innerText = 'Đang tổng hợp dữ liệu...';

      // Gọi API tạo ảnh
      const url = `https://pollinations.ai/p/${encodeURIComponent(prompt)}?width=512&height=512&seed=${Math.floor(Math.random()*1000)}`;
      
      const tempImg = new Image();
      tempImg.src = url;
      tempImg.onload = () => {
        scanner.style.display = 'none';
        img.src = url;
        img.style.display = 'block';
        placeholder.style.display = 'none';
      };
    }

    // 3. Kích hoạt hiệu ứng nghiêng 3D
    VanillaTilt.init(document.querySelector(".glass-card"));
  </script>
</body>
</html>
