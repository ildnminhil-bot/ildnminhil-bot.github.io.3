<div class="glass-card" style="padding: 20px; border: 1px solid #00f0ff; background: rgba(5,10,25,0.9); border-radius: 12px; width: 360px; text-align: center;">
  <h3 style="color: #00f0ff; margin-bottom: 10px;">🔓 LINK DECRYPTER</h3>
  <input type="text" id="shortUrl" placeholder="Dán link rút gọn / link bị mã hóa..." style="width: 100%; padding: 10px; background: #000; border: 1px solid #00f0ff; color: #fff; border-radius: 6px; margin-bottom: 10px;">
  <button onclick="bypassLink()" style="width: 100%; padding: 10px; background: #ff007f; border: none; color: #fff; font-weight: bold; cursor: pointer; border-radius: 6px;">GIẢI MÃ & BÓC LINK</button>
  <div id="bypassResult" style="margin-top: 15px; font-size: 13px; word-break: break-all; color: #00ff66;"></div>
</div>

<script>
  function bypassLink() {
    const input = document.getElementById('shortUrl').value.trim();
    const resultDiv = document.getElementById('bypassResult');
    if (!input) return alert('Vui lòng nhập link!');

    resultDiv.innerText = 'Đang phân tích cấu trúc URL...';

    setTimeout(() => {
      try {
        let cleanUrl = input;

        // 1. Giải mã nếu là chuỗi mã hóa Base64
        if (!input.startsWith('http') && input.length > 20) {
          cleanUrl = atob(input);
        } 
        // 2. Lấy link đích ẩn trong URL parameter
        else if (input.includes('?')) {
          const urlObj = new URL(input);
          const params = new URLSearchParams(urlObj.search);
          const realTarget = params.get('url') || params.get('redirect') || params.get('dest') || params.get('target');
          if (realTarget) cleanUrl = decodeURIComponent(realTarget);
        }

        resultDiv.innerHTML = `Link gốc: <br><a href="${cleanUrl}" target="_blank" style="color: #00f0ff; font-weight: bold;">${cleanUrl}</a>`;
      } catch (e) {
        resultDiv.innerText = 'Không thể tự động bóc link này. Hãy thử dùng Bookmarklet trên trang đích!';
      }
    }, 600);
  }
</script>
